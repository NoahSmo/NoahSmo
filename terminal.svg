<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440" role="img" aria-labelledby="title desc">
  <title id="title">noah@rouen — zsh</title>
  <desc id="desc">An animated terminal introducing Noah: a French developer working on Next.js and Python (AI) at Wesur, who builds native macOS apps in Swift and makes games. Featured projects: clawdio and HiddenBar.</desc>
  <style>
    text { font-family: "SF Mono", "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; fill: #c9d1d9; white-space: pre; }
    .u { fill: #7ee787; font-weight: 600; }
    .p { fill: #79c0ff; }
    .d { fill: #8b949e; }
    .o { fill: #ffa657; }
    .v { fill: #d2a8ff; }
    .y { fill: #e3b341; }
    .b { font-weight: 700; }
    .bar { font-size: 13px; fill: #8b949e; }

    .f { opacity: 0; animation: show .01s linear forwards; }
    @keyframes show { to { opacity: 1; } }

    .t { animation-name: type; animation-fill-mode: forwards; }
    @keyframes type { from { transform: translateX(0); } to { transform: translateX(var(--w)); } }

    .cur { animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .f { animation: none; opacity: 1; }
      .t { animation: none; display: none; }
    }
  </style>

  <!-- window -->
  <rect x="0.5" y="0.5" width="859" height="439" rx="12" fill="#0d1117" stroke="#30363d"/>
  <path d="M12.5 0.5h835a12 12 0 0 1 12 12V36H0.5V12.5a12 12 0 0 1 12-12z" fill="#161b22"/>
  <line x1="0.5" y1="36" x2="859.5" y2="36" stroke="#30363d"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="18" r="6" fill="#febc2e"/>
  <circle cx="62" cy="18" r="6" fill="#28c840"/>
  <text x="430" y="23" text-anchor="middle" class="bar">noah@rouen — zsh — 100×24</text>

  <!-- 1: whoami -->
  <g class="f" style="animation-delay:.2s">
    <text x="24" y="70"><tspan class="u">noah@rouen</tspan> <tspan class="p">~</tspan> % whoami</text>
    <rect class="t" x="158" y="54" width="60" height="22" fill="#0d1117" style="--w:60px;animation-duration:.5s;animation-delay:.4s;animation-timing-function:steps(6)"/>
  </g>
  <g class="f" style="animation-delay:1.1s">
    <text x="24" y="96"><tspan class="b">Noah</tspan> <tspan class="d">—</tspan> French developer <tspan class="d">·</tspan> <tspan class="v">Next.js</tspan> &amp; <tspan class="v">Python (AI)</tspan> @ <tspan class="o">Wesur</tspan></text>
  </g>

  <!-- 2: cat about.txt -->
  <g class="f" style="animation-delay:1.6s">
    <text x="24" y="134"><tspan class="u">noah@rouen</tspan> <tspan class="p">~</tspan> % cat about.txt</text>
    <rect class="t" x="158" y="118" width="122" height="22" fill="#0d1117" style="--w:122px;animation-duration:.8s;animation-delay:1.8s;animation-timing-function:steps(13)"/>
  </g>
  <g class="f" style="animation-delay:2.8s">
    <text x="24" y="160"><tspan class="d">›</tspan> building native <tspan class="o">macOS</tspan> apps in <tspan class="o">Swift</tspan> — notch widgets, menu bar tools</text>
    <text x="24" y="182"><tspan class="d">›</tspan> making <tspan class="y">games</tspan> in my free time</text>
    <text x="24" y="204"><tspan class="d">›</tspan> based in Rouen, France 🇫🇷</text>
  </g>

  <!-- 3: ls -->
  <g class="f" style="animation-delay:3.4s">
    <text x="24" y="242"><tspan class="u">noah@rouen</tspan> <tspan class="p">~</tspan> % ls ~/projects</text>
    <rect class="t" x="158" y="226" width="131" height="22" fill="#0d1117" style="--w:131px;animation-duration:.8s;animation-delay:3.6s;animation-timing-function:steps(14)"/>
  </g>
  <g class="f" style="animation-delay:4.6s">
    <text x="24" y="268"><tspan class="p b">clawdio/</tspan>    <tspan class="p b">HiddenBar/</tspan>    <tspan class="p">CUBES.NET/</tspan>    <tspan class="p">POC-Collector-Shop/</tspan>    <tspan class="d">…</tspan></text>
  </g>

  <!-- 4: brew -->
  <g class="f" style="animation-delay:5.1s">
    <text x="24" y="306"><tspan class="u">noah@rouen</tspan> <tspan class="p">~</tspan> % brew install --cask NoahSmo/clawdio/clawdio</text>
    <rect class="t" x="158" y="290" width="392" height="22" fill="#0d1117" style="--w:392px;animation-duration:1.6s;animation-delay:5.3s;animation-timing-function:steps(43)"/>
  </g>
  <g class="f" style="animation-delay:7.2s">
    <text x="24" y="332"><tspan class="p b">==&gt;</tspan> <tspan class="b">Installing Cask</tspan> <tspan class="v">clawdio</tspan></text>
  </g>
  <g class="f" style="animation-delay:7.9s">
    <text x="24" y="354">🍺  clawdio was successfully installed!</text>
  </g>

  <!-- 5: idle prompt -->
  <g class="f" style="animation-delay:8.4s">
    <text x="24" y="392"><tspan class="u">noah@rouen</tspan> <tspan class="p">~</tspan> %</text>
    <rect class="cur" x="159" y="377" width="9" height="19" fill="#c9d1d9"/>
  </g>
</svg>
